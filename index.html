<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>FPS Player · Ángel Chamon</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg:#0b0f14; --panel:#121821; --panel2:#171f2a; --text:#f5f7fa; --muted:#9aa7b5;
  --accent:#ff9d00; --line:#26313e; --green:#26c281; --yellow:#f6c344; --red:#ff5c5c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh}
.app{max-width:480px;margin:0 auto;min-height:100svh;background:linear-gradient(180deg,#0d1218 0%,#0b0f14 100%)}
.top{position:sticky;top:0;z-index:50;background:rgba(11,15,20,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.logo{font-weight:900;letter-spacing:.08em} .logo span{color:var(--accent)}
.player{font-size:12px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daybtn{border:1px solid var(--line);background:#111721;color:var(--muted);border-radius:999px;padding:9px 12px;min-width:56px;font-weight:800}
.daybtn.active{background:var(--accent);color:#111;border-color:var(--accent)}
.hero{padding:18px 16px 10px}
.kicker{font-size:12px;color:var(--accent);font-weight:900;letter-spacing:.12em}
.hero h1{font-size:28px;line-height:1.05;margin:8px 0 8px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.badge{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}
.badge.load.low{color:var(--green);border-color:rgba(38,194,129,.35)}
.badge.load.med{color:var(--yellow);border-color:rgba(246,195,68,.35)}
.badge.load.high{color:var(--red);border-color:rgba(255,92,92,.35)}
.progressWrap{padding:0 16px 10px}
.progressLabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.progress{height:7px;background:#18212b;border-radius:99px;overflow:hidden}
.progressBar{height:100%;width:0;background:var(--accent);transition:.25s}
.feed{height:calc(100svh - 208px);overflow-y:auto;scroll-snap-type:y mandatory;padding:0 12px 28px}
.card{scroll-snap-align:start;min-height:calc(100svh - 230px);display:flex;flex-direction:column;justify-content:center;margin:0 0 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.counter{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em}
.card h2{font-size:30px;line-height:1.05;margin:14px 0 18px}
.big{font-size:24px;font-weight:900;color:var(--accent);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.info{background:#0e141b;border:1px solid var(--line);border-radius:16px;padding:12px}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.value{font-size:14px;font-weight:800;line-height:1.25}
.desc{font-size:16px;line-height:1.5;color:#e8edf3;margin:8px 0 18px}
.complete{margin-top:auto;width:100%;border:none;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:900;background:#202a36;color:white}
.complete.done{background:var(--green);color:#07140e}
.control{scroll-snap-align:start;min-height:calc(100svh - 230px);margin-bottom:14px;background:#111821;border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center}
.control h2{font-size:27px;margin:0 0 8px}
.control p{color:var(--muted);line-height:1.45}
.field{margin:15px 0}
.field label{display:flex;justify-content:space-between;font-weight:800;margin-bottom:9px}
input[type=range]{width:100%;accent-color:var(--accent)}
.speedgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.speed{border:1px solid var(--line);background:#0d131a;color:white;border-radius:12px;padding:10px 4px;font-weight:800}
.speed.selected{background:var(--accent);color:#111;border-color:var(--accent)}
.save{margin-top:16px;border:0;border-radius:16px;padding:14px;background:var(--accent);color:#111;font-weight:900;font-size:15px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.footer{padding:18px 16px 28px;color:var(--muted);font-size:12px;text-align:center}
@media (min-width:700px){body{background:#080b0f} .app{box-shadow:0 0 80px rgba(0,0,0,.45)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">FPS <span>PLAYER</span></div><div class="player">Ángel Chamon</div></div>
    <div class="days" id="days"></div>
  </div>
  <section class="hero">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="meta"><span class="badge load" id="load"></span><span class="badge" id="duration"></span></div>
  </section>
  <div class="progressWrap">
    <div class="progressLabel"><span>Progreso de la sesión</span><span id="progressText">0/0</span></div>
    <div class="progress"><div class="progressBar" id="progressBar"></div></div>
  </div>
  <main class="feed" id="feed"></main>
  <div class="footer">Football Performance System · UD Sanse B</div>
</div>

<script>
const week = [{"key":"sun","day":"DOM","date":"23 AGO","title":"Recuperación + exposición suave","load":"Baja","loadClass":"low","duration":"25–30 min","exercises":[["Movilidad activa cadera/rodilla","2×8/lado","2/10","Sin material","Realiza flexión y extensión de rodilla y movilidad de cadera de forma lenta, sin forzar el rango."],["Wall Sit ISO","3×30'' · 40'' descanso","4/10","Pared","Apoya la espalda en la pared y mantén una posición cómoda de sentadilla, repartiendo la carga."],["Split Squat ISO","3×25''/lado · 40'' descanso","4/10","Sin material","Mantén la posición de zancada sin movimiento, con pelvis y rodilla estables."],["Reverse Nordic · ROM corto","3×5 · 45'' descanso","3–4/10","Superficie cómoda","De rodillas y con tronco y cadera alineados, inclínate ligeramente hacia atrás. Detente antes de notar la zona y vuelve."],["Puente glúteo unilateral","3×8/lado · 40'' descanso","4/10","Sin material","Eleva la pelvis empujando con un pie, pausa un segundo arriba y baja lentamente."],["Sóleo unilateral","3×12/lado · 40'' descanso","4/10","Escalón opcional","Con la rodilla ligeramente flexionada, eleva el talón y baja de forma controlada."],["Dead Bug","2×8/lado","3/10","Sin material","Extiende brazo y pierna contrarios manteniendo abdomen activo y zona lumbar estable."]]},{"key":"mon","day":"LUN","date":"24 AGO","title":"Fuerza sin material + longitud","load":"Baja–moderada","loadClass":"med","duration":"30–35 min","exercises":[["Movilidad dinámica","5 min","2/10","Sin material","Moviliza cadera y rodilla progresivamente, sin estiramientos intensos."],["Split Squat tempo 3-1-1","3×8/lado · 45'' descanso","5/10","Sin material","Baja en 3 segundos, pausa 1 segundo y sube de forma controlada."],["Wall Sit unilateral asistido","3×25''/lado · 45'' descanso","5/10","Pared","Mantén la posición cargando principalmente una pierna y usa la otra solo como ayuda."],["Reverse Nordic · ROM parcial","3×5 · 45'' descanso","4/10","Superficie cómoda","Inclínate hacia atrás manteniendo cadera y tronco alineados. Aumenta el recorrido solo si no aparece molestia."],["Split Squat · pierna afectada retrasada","2×6/lado · 45'' descanso","4/10","Sin material","Coloca la pierna afectada detrás y desciende de forma progresiva. No busques máxima profundidad."],["Puente glúteo unilateral","3×10/lado","5/10","Sin material","Eleva la pelvis con una pierna y controla la bajada."],["Sóleo unilateral","3×12/lado","5/10","Escalón opcional","Eleva y baja el talón con control manteniendo ligera flexión de rodilla."],["Copenhagen corto","2×20''/lado","4/10","Sofá o banco estable","Apoya la rodilla superior y mantén la pelvis elevada y estable."]]},{"key":"tue","day":"MAR","date":"25 AGO","title":"Fuerza principal I","load":"Alta","loadClass":"high","duration":"45–50 min","exercises":[["Bicicleta","5 min","2/10","Bicicleta estática","Pedalea a ritmo cómodo para preparar la pierna."],["Extensión de cuádriceps unilateral","4×5 · 90'' descanso","7–8/10","Máquina extensora","Extiende la rodilla con una carga alta pero controlable. Baja lentamente y no llegues al fallo."],["Split Squat cargado","4×5/lado · 90'' descanso","7/10","Mancuernas o barra","Desciende con control y empuja con la pierna adelantada manteniendo buena alineación."],["Prensa unilateral","3×6/lado · 75'' descanso","7/10","Prensa","Empuja con una pierna y vuelve lentamente sin perder el control de rodilla y pelvis."],["Step-up cargado","3×6/lado · 60'' descanso","6/10","Cajón + carga","Sube empujando con la pierna de apoyo y controla especialmente el descenso."],["Reverse Nordic · parcial","3×5 · 60'' descanso","4–5/10","Superficie cómoda","Inclínate hacia atrás solo dentro del rango tolerado. No fuerces el punto de molestia."],["Hip Thrust","3×6 · 75'' descanso","7/10","Banco + barra/carga","Eleva la pelvis con fuerza, pausa arriba y baja de forma controlada."],["Sóleo sentado","3×8 · 60'' descanso","6/10","Banco + carga","Con rodillas flexionadas, eleva los talones, pausa arriba y baja lentamente."]]},{"key":"wed","day":"MIÉ","date":"26 AGO","title":"Recuperación + carrera controlada","load":"Baja","loadClass":"low","duration":"30–40 min","exercises":[["Bicicleta","6 min","2/10","Bicicleta estática","Pedalea de forma cómoda y continua."],["Extensión cuádriceps ISO","2×25'' · 40'' descanso","4/10","Máquina extensora","Mantén tensión contra la resistencia sin mover la rodilla."],["Split Squat ISO","2×20''/lado","4/10","Sin material","Mantén una zancada estable sin movimiento."],["Reverse Nordic · ROM corto","2×5","3/10","Superficie cómoda","Realiza un recorrido corto y cómodo, sin acercarte al punto de molestia."],["Sóleo","2×10/lado","4/10","Carga opcional","Eleva el talón y controla el descenso."],["Marcha rápida","2×20 m","2/10","Espacio de campo","Camina rápido aumentando progresivamente el ritmo antes de empezar a correr."],["Carrera progresiva","2×20 m 40–50% + 2×20 m 50% + 2×20 m 60% + 2×20 m 65%","3–4/10","Espacio de campo","Aumenta poco a poco la velocidad. Mantén una zancada natural y para si aparece la molestia."],["Carrera 70% · solo si asintomático","2×20 m","4/10","Espacio de campo","Realízala únicamente si todos los bloques anteriores se han hecho sin molestia."]]},{"key":"thu","day":"JUE","date":"27 AGO","title":"Fuerza principal II","load":"Alta","loadClass":"high","duration":"45–50 min","exercises":[["Bicicleta","5 min","2/10","Bicicleta estática","Pedalea cómodamente para preparar la sesión."],["Extensión cuádriceps unilateral","4×6 · 90'' descanso","7–8/10","Máquina extensora","Carga exigente pero controlable, sin fallo y controlando la bajada."],["Split Squat cargado","4×5/lado · 90'' descanso","7–8/10","Barra o mancuernas","Baja con control y vuelve empujando fuerte sin perder la posición."],["Prensa unilateral","3×6/lado · 75'' descanso","7/10","Prensa","Empuja con una pierna y controla el regreso."],["Step-down cargado","3×6/lado · 60'' descanso","6/10","Cajón + carga","Desciende lentamente desde el cajón manteniendo rodilla y cadera estables."],["Reverse Nordic","3×5 · 60'' descanso","5/10","Superficie cómoda","Aumenta el recorrido solo si los días anteriores han sido bien tolerados."],["Hip Thrust","3×6 · 75'' descanso","7/10","Banco + barra/carga","Eleva la pelvis con fuerza y controla la bajada."],["Sóleo sentado","3×8","6/10","Banco + carga","Eleva los talones con rodillas flexionadas y baja lentamente."],["Copenhagen corto","2×20''/lado","5/10","Banco","Mantén pelvis elevada con la rodilla superior apoyada."]]},{"key":"fri","day":"VIE","date":"28 AGO","title":"Fuerza complementaria + carrera","load":"Moderada","loadClass":"med","duration":"35–45 min","exercises":[["Bicicleta","5 min","2/10","Bicicleta estática","Pedalea cómodamente."],["Extensión cuádriceps","3×6 · 60'' descanso","6/10","Máquina extensora","Carga moderada, ejecución controlada y sin buscar fatiga alta."],["Split Squat","2×6/lado · 60'' descanso","6/10","Carga opcional","Desciende y sube manteniendo pelvis y rodilla estables."],["Reverse Nordic","2×5","4–5/10","Superficie cómoda","Trabaja únicamente dentro del recorrido que puedas controlar sin molestia."],["RDL unilateral","2×6/lado","5/10","Mancuerna o kettlebell","Inclina el tronco desde la cadera y vuelve extendiéndola, manteniendo espalda estable."],["Sóleo","2×10/lado","5/10","Carga opcional","Eleva el talón y controla el descenso."],["Carrera progresiva","Repetir techo asintomático del miércoles; si fue bien: 2×20 m 50% + 2×60% + 2×70% + 2×75%","4/10","Espacio de campo","Consolida primero la velocidad tolerada. Sube un escalón solo si no aparece molestia."]]},{"key":"sat","day":"SÁB","date":"29 AGO","title":"Exposición funcional","load":"Moderada","loadClass":"med","duration":"35–45 min","exercises":[["Bicicleta","5 min","2/10","Bicicleta estática","Pedalea de forma cómoda."],["Extensión cuádriceps ISO","2×20''","4/10","Máquina extensora","Mantén tensión moderada sin movimiento."],["Split Squat ISO","2×20''/lado","4/10","Sin material","Mantén la posición estable sin movimiento."],["Reverse Nordic · parcial","2×4","4/10","Superficie cómoda","Realiza un recorrido controlado y sin buscar el límite."],["Carrera progresiva","Repetir máxima velocidad asintomática del viernes","4/10","Espacio de campo","Repite el nivel tolerado; no es obligatorio aumentar la velocidad."],["Curvas amplias","3–4×20 m al 60–70%","4/10","Espacio de campo","Corre describiendo una curva amplia, sin cambios bruscos ni frenadas fuertes."],["Desplazamiento lateral","2×10 m/lado","3–4/10","Espacio de campo","Desplázate lateralmente de forma controlada y sin cambios agresivos."],["Conducción","3×30''","3/10","Balón","Conduce de forma cómoda evitando cambios bruscos de dirección."],["Pase corto/medio","3×8","3–4/10","Balón","Realiza pases controlados sin buscar golpeos largos o máximos."]]}];
let current = localStorage.getItem('fps_day') || 'sun';
const speeds = [40,50,60,65,70,75,80,85];

function key(day, i){ return `fps_${day}_${i}`; }
function state(day,i){ return localStorage.getItem(key(day,i)) === '1'; }

function renderDays(){
  const el=document.getElementById('days');
  el.innerHTML=week.map(d=>`<button class="daybtn ${d.key===current?'active':''}" data-day="${d.key}">${d.day}<br><small>${d.date.split(' ')[0]}</small></button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.day; localStorage.setItem('fps_day',current); render();});
}

function updateProgress(d){
  const done=d.exercises.filter((_,i)=>state(d.key,i)).length;
  document.getElementById('progressText').textContent=`${done}/${d.exercises.length}`;
  document.getElementById('progressBar').style.width=`${(done/d.exercises.length)*100}%`;
}

function render(){
  renderDays();
  const d=week.find(x=>x.key===current);
  document.getElementById('kicker').textContent=`${d.day} · ${d.date}`;
  document.getElementById('title').textContent=d.title;
  const load=document.getElementById('load'); load.textContent=`Carga ${d.load}`; load.className=`badge load ${d.loadClass}`;
  document.getElementById('duration').textContent=`⏱ ${d.duration}`;

  const feed=document.getElementById('feed');
  feed.innerHTML=d.exercises.map((e,i)=>`
    <section class="card">
      <div class="counter">${String(i+1).padStart(2,'0')} / ${String(d.exercises.length).padStart(2,'0')}</div>
      <h2>${e[0]}</h2>
      <div class="big">${e[1]}</div>
      <div class="grid">
        <div class="info"><div class="label">Intensidad</div><div class="value">${e[2]}</div></div>
        <div class="info"><div class="label">Material</div><div class="value">${e[3]}</div></div>
      </div>
      <div class="label">Cómo se realiza</div>
      <div class="desc">${e[4]}</div>
      <button class="complete ${state(d.key,i)?'done':''}" data-i="${i}">${state(d.key,i)?'✓ Completado':'Marcar como completado'}</button>
    </section>`).join('') + `
    <section class="control">
      <div class="counter">CIERRE DE SESIÓN</div>
      <h2>Control de sensaciones</h2>
      <p>Registra cómo responde el cuádriceps. La progresión de velocidad depende de que no aparezca molestia al aumentar la longitud de la zancada.</p>

      <div class="field">
        <label><span>Molestia al finalizar</span><span id="painOut">0/10</span></label>
        <input id="pain" type="range" min="0" max="10" value="${localStorage.getItem('pain_'+d.key)||0}">
      </div>

      <div class="field">
        <label><span>Molestia en máxima longitud</span><span id="lengthPainOut">0/10</span></label>
        <input id="lengthPain" type="range" min="0" max="10" value="${localStorage.getItem('lengthPain_'+d.key)||0}">
      </div>

      <div class="field">
        <label><span>Máxima velocidad sin molestia</span><span id="speedOut">${localStorage.getItem('speed_'+d.key)||'—'}</span></label>
        <div class="speedgrid">${speeds.map(s=>`<button class="speed ${String(s)===localStorage.getItem('speed_'+d.key)?'selected':''}" data-s="${s}">${s}%</button>`).join('')}</div>
      </div>

      <button class="save" id="save">Guardar sensaciones</button>
      <div class="note">Los datos quedan guardados en este dispositivo.</div>
    </section>`;

  feed.scrollTop=0;
  feed.querySelectorAll('.complete').forEach(btn=>btn.onclick=()=>{
    const i=Number(btn.dataset.i);
    localStorage.setItem(key(d.key,i), state(d.key,i)?'0':'1');
    render();
  });

  const pain=document.getElementById('pain'), lp=document.getElementById('lengthPain');
  const po=document.getElementById('painOut'), lpo=document.getElementById('lengthPainOut');
  po.textContent=pain.value+'/10'; lpo.textContent=lp.value+'/10';
  pain.oninput=()=>po.textContent=pain.value+'/10';
  lp.oninput=()=>lpo.textContent=lp.value+'/10';

  document.querySelectorAll('.speed').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.speed').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    document.getElementById('speedOut').textContent=b.dataset.s+'%';
  });

  document.getElementById('save').onclick=()=>{
    localStorage.setItem('pain_'+d.key,pain.value);
    localStorage.setItem('lengthPain_'+d.key,lp.value);
    const sel=document.querySelector('.speed.selected');
    if(sel) localStorage.setItem('speed_'+d.key,sel.dataset.s);
    const btn=document.getElementById('save');
    btn.textContent='✓ Guardado';
    setTimeout(()=>btn.textContent='Guardar sensaciones',1200);
  };
  updateProgress(d);
}
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
