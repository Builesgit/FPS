<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>FPS Player v0.1</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0f14;--panel:#171f2a;--text:#f5f7fa;--muted:#9aa7b5;--accent:#ff9d00;--line:#26313e;--green:#26c281}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.version{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:90;padding:5px 9px;border-radius:999px;background:rgba(11,15,20,.82);border:1px solid rgba(255,255,255,.08);font-size:10px;color:var(--muted);pointer-events:none;backdrop-filter:blur(10px)}
.controlFab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:100;border:1px solid var(--line);border-radius:999px;background:var(--accent);color:#111;padding:12px 16px;font-size:13px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.35);touch-action:manipulation}
.backdrop{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(480px,100%);max-height:88svh;overflow-y:auto;background:linear-gradient(180deg,#171f2a,#121821);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));transition:transform .25s ease}
.backdrop.open .sheet{transform:translate(-50%,0)}
.handle{width:42px;height:4px;border-radius:99px;background:#34414f;margin:0 auto 18px}
.sheetHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:11px;color:var(--accent);font-weight:900;letter-spacing:.1em}.sheet h2{font-size:27px;margin:6px 0 4px}.day{font-size:12px;color:var(--muted)}
.close{border:1px solid var(--line);background:#0e141b;color:#fff;border-radius:13px;width:42px;height:42px;font-size:20px}
.field{margin:20px 0}.field label{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:800;margin-bottom:10px}input[type=range]{width:100%;accent-color:var(--accent)}
.speedgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.speed{border:1px solid var(--line);background:#0d131a;color:#fff;border-radius:12px;padding:11px 4px;font-weight:800}.speed.selected{background:var(--accent);color:#111;border-color:var(--accent)}
.save{width:100%;border:0;border-radius:16px;padding:15px;background:var(--accent);color:#111;font-weight:900;font-size:15px}.note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:10px}.saved{color:var(--green)}
</style>
</head>
<body>
<iframe src="./chamon/" title="FPS Player"></iframe>
<div class="version">FPS PLAYER · v0.1</div>
<button class="controlFab" id="openControl" type="button">Sensaciones</button>
<div class="backdrop" id="backdrop">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="controlTitle">
    <div class="handle"></div>
    <div class="sheetHead"><div><div class="eyebrow">CIERRE DE SESIÓN</div><h2 id="controlTitle">Control de sensaciones</h2><div class="day" id="controlDay"></div></div><button class="close" id="closeControl" type="button">×</button></div>
    <div class="field"><label><span>Molestia al finalizar</span><span id="painOut">0/10</span></label><input id="pain" type="range" min="0" max="10" value="0"></div>
    <div class="field"><label><span>Molestia en máxima longitud</span><span id="lengthPainOut">0/10</span></label><input id="lengthPain" type="range" min="0" max="10" value="0"></div>
    <div class="field"><label><span>Máxima velocidad sin molestia</span><span id="speedOut">—</span></label><div class="speedgrid" id="speedgrid"></div></div>
    <button class="save" id="saveControl" type="button">Guardar sensaciones</button>
    <div class="note">Se mantiene el control de sensaciones de V0. En v0.1 los datos continúan guardándose localmente en el dispositivo.</div>
  </section>
</div>
<script>
const days={sun:'DOM · 23 AGO',mon:'LUN · 24 AGO',tue:'MAR · 25 AGO',wed:'MIÉ · 26 AGO',thu:'JUE · 27 AGO',fri:'VIE · 28 AGO',sat:'SÁB · 29 AGO'};
const speeds=[40,50,60,65,70,75,80,85];
const backdrop=document.getElementById('backdrop'),pain=document.getElementById('pain'),lengthPain=document.getElementById('lengthPain');
const painOut=document.getElementById('painOut'),lengthPainOut=document.getElementById('lengthPainOut'),speedOut=document.getElementById('speedOut'),grid=document.getElementById('speedgrid');
function dayKey(){return localStorage.getItem('fps_day')||'sun'}
function syncRanges(){painOut.textContent=pain.value+'/10';lengthPainOut.textContent=lengthPain.value+'/10'}
function loadControl(){const d=dayKey();document.getElementById('controlDay').textContent=days[d]||d;pain.value=localStorage.getItem('pain_'+d)||0;lengthPain.value=localStorage.getItem('lengthPain_'+d)||0;const savedSpeed=localStorage.getItem('speed_'+d)||'';speedOut.textContent=savedSpeed?savedSpeed+'%':'—';grid.innerHTML=speeds.map(s=>`<button type="button" class="speed ${String(s)===savedSpeed?'selected':''}" data-speed="${s}">${s}%</button>`).join('');grid.querySelectorAll('.speed').forEach(b=>b.addEventListener('click',()=>{grid.querySelectorAll('.speed').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');speedOut.textContent=b.dataset.speed+'%'}));syncRanges()}
function openSheet(){loadControl();backdrop.classList.add('open')}
function closeSheet(){backdrop.classList.remove('open')}
document.getElementById('openControl').addEventListener('click',openSheet);document.getElementById('closeControl').addEventListener('click',closeSheet);backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeSheet()});pain.addEventListener('input',syncRanges);lengthPain.addEventListener('input',syncRanges);
document.getElementById('saveControl').addEventListener('click',()=>{const d=dayKey();localStorage.setItem('pain_'+d,pain.value);localStorage.setItem('lengthPain_'+d,lengthPain.value);const selected=grid.querySelector('.speed.selected');if(selected)localStorage.setItem('speed_'+d,selected.dataset.speed);const b=document.getElementById('saveControl');b.textContent='✓ Guardado';b.classList.add('saved');setTimeout(()=>{b.textContent='Guardar sensaciones';b.classList.remove('saved');closeSheet()},900)});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
</html>
