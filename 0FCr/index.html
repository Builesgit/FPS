<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><title>FPS Player · Francisco Crespo</title><style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#171f2a;--text:#f5f7fa;--muted:#9aa7b5;--accent:#ff9d00;--line:#26313e;--green:#26c281;--yellow:#f6c344;--red:#ff5c5c}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh}.app{max-width:480px;margin:0 auto;min-height:100svh;background:linear-gradient(180deg,#0d1218,#0b0f14);overflow:hidden}.top{height:auto;overflow:hidden;background:rgba(11,15,20,.98);border-bottom:1px solid var(--line);transition:max-height .25s ease,opacity .2s ease}.brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 11px}.logo{font-weight:900;letter-spacing:.08em;font-size:18px}.logo span{color:var(--accent)}.player{font-size:12px;color:var(--muted)}.days{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.daybtn{border:1px solid var(--line);background:#111721;color:var(--muted);border-radius:999px;padding:10px 14px;min-width:58px;font-weight:800}.daybtn.active{background:var(--accent);color:#111;border-color:var(--accent)}.progressDock{display:none;padding:12px 16px 13px;background:rgba(11,15,20,.98);border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.3)}.app.compact .top{max-height:0;opacity:0;border-color:transparent}.app.compact .progressDock{display:block}.progressLabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}.progress{height:8px;background:#18212b;border-radius:999px;overflow:hidden}.progressBar{height:100%;width:0;background:var(--accent);transition:.2s}.feed{height:calc(100svh - 126px);overflow-y:auto;scroll-snap-type:y proximity;padding:0 12px calc(100px + env(safe-area-inset-bottom));overscroll-behavior:contain}.app.compact .feed{height:calc(100svh - 58px)}.summary{scroll-snap-align:start;min-height:calc(100svh - 138px);padding:26px 10px 24px;display:flex;flex-direction:column;justify-content:center}.kicker{font-size:13px;color:var(--accent);font-weight:900;letter-spacing:.12em}.summary h1{font-size:34px;line-height:1.03;margin:10px 0 14px}.sub{font-size:14px;color:var(--muted);margin-bottom:18px}.sectionLabel{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}.objective{font-size:16px;line-height:1.45;margin-bottom:18px}.criterion{background:#111821;border:1px solid var(--line);border-radius:16px;padding:13px 14px;font-size:14px;line-height:1.45;margin-bottom:18px}.exerciseSummary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.pill{background:#111821;border:1px solid var(--line);border-radius:14px;padding:10px 11px;font-size:12px;line-height:1.25}.summaryProgress{margin-top:auto;padding-top:12px}.hint{margin-top:11px;font-size:12px;color:var(--muted)}.card{scroll-snap-align:start;min-height:calc(100svh - 90px);display:flex;flex-direction:column;justify-content:flex-start;position:relative;margin:0 0 16px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px 22px calc(26px + env(safe-area-inset-bottom));box-shadow:0 18px 50px rgba(0,0,0,.25)}.counter{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em}.navExercise{position:absolute;top:18px;right:18px;display:flex;flex-direction:column;gap:8px}.navExercise button{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#0e141b;color:#fff;font-size:20px;font-weight:900;touch-action:manipulation}.navExercise button:disabled{opacity:.25}.card h2{font-size:31px;line-height:1.05;margin:18px 56px 20px 0}.big{font-size:25px;font-weight:900;color:var(--accent);margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.info{background:#0e141b;border:1px solid var(--line);border-radius:16px;padding:13px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.value{font-size:15px;font-weight:800;line-height:1.25}.desc{font-size:17px;line-height:1.5;color:#e8edf3;margin:8px 0 24px}.complete{margin-top:auto;width:100%;min-height:52px;border:none;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:900;background:#202a36;color:#fff;touch-action:manipulation}.complete.done{background:var(--green);color:#07140e}.weekInfo{scroll-snap-align:start;background:#111821;border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px}.weekInfo h2{font-size:25px;margin:0 0 14px}.weekInfo li{margin:9px 0;line-height:1.4}.avoid{margin-top:18px;padding:14px;border-radius:16px;background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.25);line-height:1.45}@media(min-width:700px){body{background:#080b0f}.app{box-shadow:0 0 80px rgba(0,0,0,.45)}}
</style></head><body><div class="app" id="app"><header class="top"><div class="brand"><div class="logo">FPS <span>PLAYER</span></div><div class="player">Francisco Crespo · v0FCr</div></div><div class="days" id="days"></div></header><div class="progressDock"><div class="progressLabel"><span>Progreso de la sesión</span><span id="dockProgressText"></span></div><div class="progress"><div class="progressBar" id="dockProgressBar"></div></div></div><main class="feed" id="feed"></main></div><script>
const week=[{"key":"s1","day":"S1","date":"SESIÓN 1","title":"Fuerza isométrica + cadena posterior","objective":"progresar desde la tolerancia isométrica de la semana 1 hacia fuerza dinámica submáxima, mayor longitud funcional del isquiosural y una primera exposición locomotora controlada, siempre sin dolor ni respuesta adversa al día siguiente.","criterion":"0–2/10 de molestia como máximo, sin pinchazo, sin aumento de síntomas durante la sesión y sin empeoramiento claro en las siguientes 24 h. Si aparece respuesta adversa, volver al último nivel bien tolerado.","exercises":[["Bicicleta suave","5 min","2/10","Bicicleta","Pedaleo cómodo, sin aumentar resistencia ni buscar fatiga."],["Movilidad activa cadera/rodilla","2 × 8/lado","2/10","Sin material","Movimientos lentos de flexión-extensión dentro de rango cómodo."],["Isométrico isquios talón apoyado – 2 ángulos","3 × 25 s/posición · 40 s","4/10","Colchoneta","Presiona el talón contra el suelo: primero rodilla flexionada y después algo más extendida."],["Puente bilateral con pies alejados","3 × 10 · 45 s","4/10","Colchoneta","Eleva pelvis con talones algo alejados para aumentar progresivamente la demanda del isquio."],["Hip Thrust bilateral","3 × 10 · 60 s","4/10","Banco","Extiende cadera de forma controlada y simétrica; pausa breve arriba."],["Pallof Press","3 × 10/lado · 30 s","3/10","Banda","Empuja la banda al frente evitando rotación del tronco."]]},{"key":"s2","day":"S2","date":"SESIÓN 2","title":"Fuerza dinámica inicial","objective":"progresar desde la tolerancia isométrica de la semana 1 hacia fuerza dinámica submáxima, mayor longitud funcional del isquiosural y una primera exposición locomotora controlada, siempre sin dolor ni respuesta adversa al día siguiente.","criterion":"0–2/10 de molestia como máximo, sin pinchazo, sin aumento de síntomas durante la sesión y sin empeoramiento claro en las siguientes 24 h. Si aparece respuesta adversa, volver al último nivel bien tolerado.","exercises":[["Bicicleta + movilidad","5 + 4 min","2/10","Bicicleta","Pedaleo suave seguido de movilidad activa de cadera, rodilla y tobillo."],["Curl de isquios con fitball bilateral","3 × 8 · 60 s","4/10","Fitball","Desde puente, acerca lentamente el balón con ambos talones y vuelve con control."],["RDL bilateral con rango corto","3 × 8 · 60 s","4/10","Kettlebell/barra ligera","Bisagra de cadera con rodillas desbloqueadas. Baja solo hasta rango cómodo, espalda neutra."],["Split Squat corto","3 × 8/lado · 45 s","4/10","Peso corporal","Zancada estática con recorrido cómodo y reparto estable de cargas."],["Sóleo bilateral","3 × 15 · 30 s","3/10","Apoyo","Rodillas ligeramente flexionadas; eleva y baja talones con control."],["Dead Bug","3 × 8/lado · 30 s","3/10","Colchoneta","Mantén pelvis estable mientras alternas brazo y pierna contraria."]]},{"key":"s3","day":"S3","date":"SESIÓN 3","title":"Recuperación activa + control","objective":"progresar desde la tolerancia isométrica de la semana 1 hacia fuerza dinámica submáxima, mayor longitud funcional del isquiosural y una primera exposición locomotora controlada, siempre sin dolor ni respuesta adversa al día siguiente.","criterion":"0–2/10 de molestia como máximo, sin pinchazo, sin aumento de síntomas durante la sesión y sin empeoramiento claro en las siguientes 24 h. Si aparece respuesta adversa, volver al último nivel bien tolerado.","exercises":[["Bicicleta aeróbica suave","10–12 min","2–3/10","Bicicleta","Pedaleo continuo cómodo; objetivo circulatorio, no de fatiga."],["Movilidad dinámica global","2 × 6/lado","2/10","Sin material","Movilidad de tobillo, cadera y rodilla sin estiramiento agresivo del isquio."],["Isométrico isquios – 2 ángulos","3 × 20 s/posición · 40 s","3/10","Colchoneta","Contracción submáxima y estable en dos posiciones de rodilla."],["Puente bilateral","2 × 10 · 40 s","3/10","Colchoneta","Elevación de pelvis controlada, buscando simetría."],["Pallof Press","2 × 10/lado","3/10","Banda","Control antirotacional sin compensaciones."]]},{"key":"s4","day":"S4","date":"SESIÓN 4","title":"Longitud funcional + fuerza","objective":"progresar desde la tolerancia isométrica de la semana 1 hacia fuerza dinámica submáxima, mayor longitud funcional del isquiosural y una primera exposición locomotora controlada, siempre sin dolor ni respuesta adversa al día siguiente.","criterion":"0–2/10 de molestia como máximo, sin pinchazo, sin aumento de síntomas durante la sesión y sin empeoramiento claro en las siguientes 24 h. Si aparece respuesta adversa, volver al último nivel bien tolerado.","exercises":[["Bicicleta + movilidad","5 + 4 min","2/10","Bicicleta","Activación general y movilidad activa antes de cargar."],["RDL bilateral","3 × 8 · 60–75 s","5/10","Kettlebell/barra ligera","Bisagra de cadera progresando ligeramente el recorrido respecto a sesión 2, sin buscar estiramiento máximo."],["Curl fitball bilateral","3 × 10 · 60 s","5/10","Fitball","Flexiona rodillas acercando el fitball; regreso lento y controlado."],["Hip Thrust bilateral","3 × 8 · 60 s","5/10","Banco + carga ligera opcional","Extensión de cadera controlada con pausa de 2 s arriba."],["Split Squat","3 × 8/lado · 45 s","4/10","Peso corporal","Aumenta ligeramente el recorrido si la respuesta de sesiones previas fue buena."],["Gemelo unilateral asistido","3 × 10/lado","4/10","Apoyo","Eleva el talón sobre una pierna utilizando apoyo para equilibrarte."]]},{"key":"s5","day":"S5","date":"SESIÓN 5","title":"Primera exposición locomotora controlada","objective":"progresar desde la tolerancia isométrica de la semana 1 hacia fuerza dinámica submáxima, mayor longitud funcional del isquiosural y una primera exposición locomotora controlada, siempre sin dolor ni respuesta adversa al día siguiente.","criterion":"0–2/10 de molestia como máximo, sin pinchazo, sin aumento de síntomas durante la sesión y sin empeoramiento claro en las siguientes 24 h. Si aparece respuesta adversa, volver al último nivel bien tolerado.","exercises":[["Bicicleta suave","5 min","2/10","Bicicleta","Activación sin fatiga."],["Marcha técnica","3 × 20 m","2/10","Campo","Camina con postura alta y apoyo fluido, sin alargar de forma forzada la zancada."],["Marcha rápida progresiva","4 × 30 m · vuelta andando","3/10","Campo","Aumenta el ritmo de marcha manteniendo zancada natural y sin tirón posterior."],["Desplazamiento lateral suave","3 × 15 m/lado","3/10","Campo","Pasos laterales cortos y controlados, sin cambios bruscos de dirección."],["Isométrico isquios – ángulo largo tolerado","3 × 25 s · 45 s","4/10","Colchoneta","Talón algo más alejado del glúteo; presiona sin movimiento y sin buscar máxima extensión."],["Puente bilateral pies alejados","3 × 10","4/10","Colchoneta","Eleva pelvis manteniendo control y apoyo simétrico."]]},{"key":"s6","day":"S6","date":"SESIÓN 6","title":"Consolidación + control de respuesta","objective":"progresar desde la tolerancia isométrica de la semana 1 hacia fuerza dinámica submáxima, mayor longitud funcional del isquiosural y una primera exposición locomotora controlada, siempre sin dolor ni respuesta adversa al día siguiente.","criterion":"0–2/10 de molestia como máximo, sin pinchazo, sin aumento de síntomas durante la sesión y sin empeoramiento claro en las siguientes 24 h. Si aparece respuesta adversa, volver al último nivel bien tolerado.","exercises":[["Bicicleta + movilidad","5 + 4 min","2/10","Bicicleta","Activación general antes de la sesión."],["RDL bilateral","3 × 8 · 60 s","5/10","Kettlebell/barra ligera","Bisagra controlada en el mayor rango indoloro alcanzado durante la semana."],["Curl fitball bilateral","3 × 10 · 60 s","5/10","Fitball","Acerca el balón con ambos talones y retorna lentamente."],["Hip Thrust bilateral","3 × 10 · 60 s","5/10","Banco","Extensión de cadera simétrica, sin aceleraciones."],["Marcha rápida","4 × 30 m · vuelta andando","3/10","Campo","Ritmo vivo pero sin convertirlo en carrera; zancada natural."],["Pallof Press","3 × 10/lado","3/10","Banda","Mantén tronco estable ante la tensión lateral de la banda."]]}];
let current=localStorage.getItem('fcr_session')||'s1';const app=document.getElementById('app'),feed=document.getElementById('feed');function storageKey(s,i){return `fcr_${s}_${i}`}function done(s,i){return localStorage.getItem(storageKey(s,i))==='1'}function renderTabs(){const el=document.getElementById('days');el.innerHTML=week.map(d=>`<button class="daybtn ${d.key===current?'active':''}" data-day="${d.key}">${d.day}</button>`).join('');el.querySelectorAll('.daybtn').forEach(b=>b.onclick=()=>{current=b.dataset.day;localStorage.setItem('fcr_session',current);render()})}function updateProgress(d){const count=d.exercises.reduce((n,_,i)=>n+(done(d.key,i)?1:0),0),pct=d.exercises.length?100*count/d.exercises.length:0;['summaryProgressText','dockProgressText'].forEach(id=>{const x=document.getElementById(id);if(x)x.textContent=`${count}/${d.exercises.length}`});['summaryProgressBar','dockProgressBar'].forEach(id=>{const x=document.getElementById(id);if(x)x.style.width=`${pct}%`})}function go(i){if(i<0)feed.querySelector('.summary')?.scrollIntoView({behavior:'smooth',block:'start'});else feed.querySelector(`[data-card="${i}"]`)?.scrollIntoView({behavior:'smooth',block:'start'})}function render(){renderTabs();const d=week.find(x=>x.key===current),names=d.exercises.map(e=>e[0]);feed.innerHTML=`<section class="summary"><div class="kicker">${d.date}</div><h1>${d.title}</h1><div class="sub">Readaptación · Semana 2 · Rotura unión tendón–bíceps femoral</div><div class="sectionLabel">Objetivo semanal</div><div class="objective">${d.objective}</div><div class="sectionLabel">Criterio de control</div><div class="criterion">${d.criterion}</div><div class="sectionLabel">Resumen · ${d.exercises.length} ejercicios</div><div class="exerciseSummary">${names.map((n,i)=>`<div class="pill">${String(i+1).padStart(2,'0')} · ${n}</div>`).join('')}</div><div class="summaryProgress"><div class="progressLabel"><span>Progreso de la sesión</span><span id="summaryProgressText"></span></div><div class="progress"><div class="progressBar" id="summaryProgressBar"></div></div><div class="hint">Marca cada ejercicio al terminarlo.</div></div></section>${d.exercises.map((e,i)=>`<section class="card" data-card="${i}"><div class="counter">${String(i+1).padStart(2,'0')} / ${String(d.exercises.length).padStart(2,'0')}</div><div class="navExercise"><button type="button" class="prev" data-i="${i}">↑</button><button type="button" class="next" data-i="${i}" ${i===d.exercises.length-1?'disabled':''}>↓</button></div><h2>${e[0]}</h2><div class="big">${e[1]}</div><div class="grid"><div class="info"><div class="label">Intensidad</div><div class="value">${e[2]}</div></div><div class="info"><div class="label">Material</div><div class="value">${e[3]}</div></div></div><div class="label">Cómo se realiza</div><div class="desc">${e[4]}</div><button type="button" class="complete ${done(d.key,i)?'done':''}" data-i="${i}">${done(d.key,i)?'✓ Completado':'Marcar como completado'}</button></section>`).join('')}<section class="weekInfo"><h2>Criterios para avanzar a Semana 3</h2><ul><li>Marcha rápida y actividades de vida diaria sin dolor ni sensación de tirón.</li><li>Isométricos en diferentes ángulos bien tolerados y sin respuesta adversa a 24 h.</li><li>RDL bilateral y curl bilateral dinámico con técnica estable y dolor ≤2/10.</li><li>Puente/hip thrust sin compensaciones claras entre miembros.</li><li>Ausencia de aumento de dolor o rigidez posterior tras la primera exposición locomotora.</li></ul><div class="avoid"><strong>Esta semana evitamos:</strong> sprint, aceleraciones máximas, cambios de dirección intensos, golpeos de máxima amplitud, zancadas forzadas para alcanzar balón, Nordics de alta intensidad y estiramientos pasivos agresivos del isquiosural.</div></section>`;feed.scrollTop=0;app.classList.remove('compact');feed.querySelectorAll('.complete').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.i,next=!done(d.key,i);localStorage.setItem(storageKey(d.key,i),next?'1':'0');btn.classList.toggle('done',next);btn.textContent=next?'✓ Completado':'Marcar como completado';updateProgress(d)});feed.querySelectorAll('.prev').forEach(b=>b.onclick=()=>go(+b.dataset.i-1));feed.querySelectorAll('.next').forEach(b=>b.onclick=()=>go(+b.dataset.i+1));updateProgress(d)}let raf=false;feed.addEventListener('scroll',()=>{if(raf)return;raf=true;requestAnimationFrame(()=>{app.classList.toggle('compact',feed.scrollTop>80);raf=false})},{passive:true});render();
</script></body></html>
