<style>

<script>
const KEY='fps_miguel_v0M1';const clone=o=>JSON.parse(JSON.stringify(o));const today=()=>new Date().toISOString().slice(0,10);const blank={profile:{name:'Miguel',category:'Senior',sport:'Fútbol',position:'',injury:'Tendón rotuliano',injuredSide:'',dominantSide:'',injuryDate:'',rehabStartDate:'',diagnosis:'',estimatedTime:'',medicalNotes:'',restrictions:'',professional:'PF Dani Builes'},session:{date:today(),status:'Valoración inicial',phase:'Sesión 0',visaP:'',level:'',limitations:'',strengths:'',objectives:'',pfNotes:'',blocks:{},data:{},control24:{}},history:[],tab:'Inicio',open:1};let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||clone(blank)}catch{return clone(blank)}})();const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const n=v=>{let x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)?x:0};const asym=(a,b)=>{a=n(a);b=n(b);let m=Math.max(Math.abs(a),Math.abs(b));return m?Math.abs(a-b)/m*100:0};const pc=v=>n(v)<=2?'green':n(v)<=4?'yellow':'red';const visa=v=>n(v)>=90?'Capacidad funcional elevada':n(v)>=70?'Limitación leve':n(v)>=50?'Limitación moderada':'Limitación importante';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function field(l,k,type='text',obj='data'){let v=obj==='profile'?S.profile[k]:obj==='session'?S.session[k]:S.session.data[k];return `<div class="field"><label>${l}</label><input data-obj="${obj}" data-k="${k}" type="${type}" value="${esc(v||'')}"></div>`}function area(l,k,obj='data'){let v=obj==='profile'?S.profile[k]:obj==='session'?S.session[k]:S.session.data[k];return `<div class="field"><label>${l}</label><textarea data-obj="${obj}" data-k="${k}">${esc(v||'')}</textarea></div>`}function sel(l,k,opts,obj='data'){let v=obj==='profile'?S.profile[k]:obj==='session'?S.session[k]:S.session.data[k];return `<div class="field"><label>${l}</label><select data-obj="${obj}" data-k="${k}"><option value="">Seleccionar</option>${opts.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function nrs(l,k){let v=n(S.session.data[k]);return `<div class="field"><label>${l}</label><div class="nrsrow"><input data-nrs="${k}" type="range" min="0" max="10" step="1" value="${v}"><span id="v_${k}" class="pill ${pc(v)}">${v}/10</span></div></div>`}function yn(l,k){let v=S.session.data[k]||'';return `<div class="field"><label>${l}</label><div class="grid2"><button class="btn2 ${v==='Sí'?'on':''}" data-yn="${k}" data-v="Sí">Sí</button><button class="btn2" data-yn="${k}" data-v="No">No</button></div>${v==='Sí'?nrs('NRS',k+'NRS'):''}</div>`}function side(title,p,fields){return `<div class="side"><h4>${title}</h4>${fields.map(([l,s,t])=>t==='nrs'?nrs(l,p+s):field(l,p+s,t||'text')).join('')}</div>`}function blockHead(i,title){let st=S.session.blocks[i]||'Pendiente';return `<div class="card section ${S.open===i?'on':''}" data-sec="${i}"><div class="k">Bloque ${i}</div><div class="h2">${title}</div>${sel('Estado del bloque','block'+i,['Pendiente','Completado','No realizado','No procede'],'block')}</div>`}const titles=['Anamnesis','VISA-P','Dolor basal','Observación y movilidad','Sentadilla bilateral','Single Leg Squat','Single Leg Decline Squat','Isométricos','Fuerza de cuádriceps','Split Squat','Tests de salto','Reactividad','Campo'];function statusSel(i){let v=S.session.blocks[i]||'Pendiente';return `<div class="field"><label>Estado del bloque</label><select data-block="${i}">${['Pendiente','Completado','No realizado','No procede'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function card(i,title,body){return `<section class="card section ${S.open===i?'on':''}" data-sec="${i}"><div class="k">Bloque ${i}</div><div class="h2">${title}</div>${statusSel(i)}${body}</section>`}function sessionHTML(){let d=S.session.data;let complete=Object.values(S.session.blocks).filter(x=>x==='Completado').length;let nav=`<div class="card"><div style="display:flex;justify-content:space-between"><div><div class="k">Sesión 0</div><div class="h2">Valoración inicial</div></div><b>${complete}/13</b></div><div class="blocks">${titles.map((t,i)=>`<button class="bnum ${S.open===i+1?'on':''} ${S.session.blocks[i+1]==='Completado'?'done':''}" data-open="${i+1}">${i+1}</button>`).join('')}</div><div class="progress"><div style="width:${complete/13*100}%"></div></div></div>`;let b1=card(1,titles[0],field('Fecha de lesión','injuryDate','date')+sel('Inicio','onset',['Traumático','Progresivo'])+['mechanism','painLocation','timeSince','treatments','priorPhysio','medication','injections','surgery','recentTraining','lastFootball','lastRun','lastSprint','lastJumps'].map((k,i)=>field(['Mecanismo lesional','Localización exacta del dolor','Tiempo desde la lesión','Tratamientos realizados','Fisioterapia previa','Medicación','Infiltraciones','Cirugía','Entrenamiento reciente','Última sesión de fútbol','Última exposición a carrera','Última exposición a sprint','Última exposición a saltos'][i],k)).join('')+[['restQ','¿Dolor en reposo?'],['walkQ','¿Dolor al caminar?'],['stairsUpQ','¿Dolor al subir escaleras?'],['stairsDownQ','¿Dolor al bajar escaleras?'],['sitQ','¿Dolor al sentarse/agacharse?'],['postTrainingQ','¿Dolor después del entrenamiento?'],['morningStiffQ','¿Rigidez matutina?']].map(x=>yn(x[1],x[0])).join('')+area('Observaciones','anamnesisNotes'));let b2=card(2,titles[1],field('VISA-P total /100','visaP','number','session')+`<div class="metric"><small>Interpretación funcional</small><strong>${visa(S.session.visaP)}</strong><div class="tiny">Referencia funcional, no diagnóstico médico.</div></div>`);let b3=card(3,titles[2],nrs('NRS reposo','painRest')+nrs('NRS caminando','painWalk')+nrs('NRS sentadilla','painSquat')+nrs('NRS escaleras','painStairs')+painBars([['Reposo',d.painRest],['Caminar',d.painWalk],['Squat',d.painSquat],['Escaleras',d.painStairs]]));let b4=card(4,titles[3],yn('Inflamación visible','swelling')+yn('Atrofia de cuádriceps','atrophy')+field('Diferencia a':delta>0?'Empeora':'Sin cambios'} · ${delta>0?'+':''}${delta}</strong></div>`+area('Observaciones','isoNotes'));let as=asym(d.quadRightForce||d.quadRightLoad,d.quadLeftForce||d.quadLeftLoad);let b9=card(9,titles[8],sel('Método','quadMethod',['Máquina extensora','Dinamómetro','VBT','Carga externa','Test funcional','Otro'])+side('Derecha','quadRight',[['Carga','Load','number'],['Repeticiones','Reps','number'],['Velocidad','Velocity','number'],['Fuerza','Force','number'],['Dolor','Pain','nrs'],['RPE','RPE','nrs']])+side('Izquierda','quadLeft',[['Carga','Load','number'],['Repeticiones','Reps','number'],['Velocidad','Velocity','number'],['Fuerza','Force','number'],['Dolor','Pain','nrs'],['RPE','RPE','nrs']])+`<div class="metric"><small>Asimetría D/I</small><strong>${as.toFixed(1)}%</strong></div>`);let b10=card(10,titles[9],side('Derecha','splitRight',[['Carga','Load','number'],['Repeticiones','Reps','number'],['Dolor','Pain','nrs'],['RPE','RPE','nrs']])+side('Izquierda','splitLeft',[['Carga','Load','number'],['Repeticiones','Reps','number'],['Dolor','Pain','nrs'],['RPE','RPE','nrs']])+field('Profundidad','splitDepth')+sel('Técnica','splitTechnique',['Buena','Aceptable','Deficiente'])+area('Observaciones','splitNotes'));let jumps=d.jumpGate==='Sí';let best=Math.max(n(d.cmj1),n(d.cmj2),n(d.cmj3));let mean=(n(d.cmj1)+n(d.cmj2)+n(d.cmj3))/3;let b11=card(11,titles[10],`<div class="gate">${yn('¿El jugador ha tolerado correctamente las fases anteriores?','jumpGate')}</div>`+(jumps?`<div class="h2">CMJ</div>${[1,2,3].map(i=>field('Intento '+i+' · cm','cmj'+i,'number')+nrs('Dolor intento '+i,'cmjPain'+i)).join('')}<div class="grid2"><div class="metric"><small>Mejor CMJ</small><strong>${best.toFixed(1)} cm</strong></div><div class="metric"><small>Media CMJ</small><strong>${mean.toFixed(1)} cm</strong></div></div><div class="h2">Single Leg CMJ</div>${['R','L'].map(s=>`<div class="side"><h4>${s==='R'?'Derecha':'Izquierda'}</h4>${[1,2,3].map(i=>field('Intento '+i,'slcmj'+s+i,'number')).join('')}</div>`).join('')}<div class="metric"><small>Asimetría SL CMJ</small><strong>${asym(Math.max(n(d.slcmjR1),n(d.slcmjR2),n(d.slcmjR3)),Math.max(n(d.slcmjL1),n(d.slcmjL2),n(d.slcmjL3))).toFixed(1)}%</strong></div>`:`<div class="warn">🔒 Bloque condicionado a tolerancia de fases anteriores.</div>`));let rsi=n(d.dropJumpContact)>0?n(d.dropJumpHeight)/n(d.dropJumpContact):0;let react=(title,p,drop=false)=>`<div class="side"><h4>${title}</h4>${yn('Realizado',''+p+'Done')}${field('Número de contactos',p+'Contacts','number')}${drop?field('Altura cajón',p+'BoxHeight','number')+field('Altura salto',p+'Height','number')+field('Tiempo contacto (s)',p+'Contact','number'):''}${nrs('Dolor NRS',p+'Pain')}${nrs('RPE',p+'RPE')}${area('Observaciones',p+'Notes')}</div>`;let b12=card(12,titles[11],react('Pogos','pogos')+react('Saltos bilaterales','bilateralJump')+react('Drop Jump','dropJump',true)+`<div class="metric"><small>RSI</small><strong>${rsi?rsi.toFixed(2):'—'}</strong></div>`);let fieldOK=d.fieldGate==='Sí';let run=x=>`<div class="side"><h4>${x}%</h4>${field('Distancia','run'+x+'Distance')}${field('Repeticiones','run'+x+'Reps','number')}${nrs('Dolor','run'+x+'Pain')}${nrs('RPE','run'+x+'RPE')}</div>`;let acc=x=>`<div class="side"><h4>${x} m</h4>${field('Repeticiones','acc'+x+'Reps','number')}${field('Intensidad estimada %','acc'+x+'Intensity','number')}${nrs('Dolor','acc'+x+'Pain')}${nrs('RPE','acc'+x+'RPE')}${area('Observaciones','acc'+x+'Notes')}</div>`;let b13=card(13,titles[12],`<div class="gate">${yn('¿Fases anteriores toleradas?','fieldGate')}</div>`+(fieldOK?`<div class="h2">Carrera progresiva</div>${[50,60,70].map(run).join('')}<div class="h2">Aceleraciones</div>${[10,15].map(acc).join('')}`:`<div class="warn">🔒 Campo condicionado a tolerancia previa.</div>`));let painProfile=`<div class="card"><div class="k">Perfil carga–dolor</div><div class="h2">Respuesta según demanda mecánica</div>${painBars([['Reposo',d.painRest],['Squat',d.squatPain],['SL Squat',Math.max(n(d.slsRightPain),n(d.slsLeftPain))],['Decline',Math.max(n(d.declineRightPain),n(d.declineLeftPain))],['Isométrico',d.isoDuring],['Split Squat',Math.max(n(d.splitRightPain),n(d.splitLeftPain))],['CMJ',Math.max(n(d.cmjPain1),n(d.cmjPain2),n(d.cmjPain3))],['Pogos',d.pogosPain],['Drop Jump',d.dropJumpPain],['Carrera',Math.max(n(d.run50Pain),n(d.run60Pain),n(d.run70Pain))],['Aceleración',Math.max(n(d.acc10Pain),n(d.acc15Pain))]])}</div>`;return nav+b1+b2+b3+b4+b5+b6+b7+b8+b9+b10+b11+b12+b13+painProfile+classifyHTML()+`<button class="btn" id="finalize">FINALIZAR VALORACIÓN</button>`}function painBars(items){return `<div>${items.map(([l,v])=>`<div class="tiny" style="display:flex;justify-content:space-between"><span>${l}</span><b>${n(v)}/10</b></div><div class="bar"><i style="width:${n(v)*10}%;background:${n(v)<=2?'#22c55e':n(v)<=4?'#eab308':'#ef4444'}"></i></div>`).join('')}</div>`}function compare(r,l){r=n(r);l=n(l);let m=Math.max(r,l,1);return `<div class="tiny">Derecha ${r}</div><div class="bar"><i style="width:${r/m*100}%"></i></div><div class="tiny">Izquierda ${l}</div><div class="bar"><i style="width:${l/m*100}%;background:#38bdf8"></i></div>`}function suggest(){let d=S.session.data,basic=Math.max(n(d.painRest),n(d.painWalk),n(d.painSquat)),str=Math.max(n(d.squatPain),n(d.slsRightPain),n(d.slsLeftPain),n(d.declineRightPain),n(d.declineLeftPain)),el=Math.max(n(d.cmjPain1),n(d.cmjPain2),n(d.pogosPain),n(d.dropJumpPain)),fi=Math.max(n(d.run50Pain),n(d.run60Pain),n(d.run70Pain),n(d.acc10Pain),n(d.acc15Pain));if(basic>=5||str>=5)return'A';if(el>=3)return'B';if(d.fieldGate!=='Sí'||fi>=3)return'C';return'D'}function classifyHTML(){let lev=S.session.level||suggest();return `<div class="card"><div class="k">Clasificación</div><div class="h2">Nivel funcional actual</div><div class="mut">Sugerencia automática: Nivel ${suggest()}</div><div class="grid2" style="grid-template-columns:repeat(4,1fr);margin-top:10px">${['A','B','C','D'].map(x=>`<button class="btn2" data-level="${x}" style="${lev===x?'background:#f59e0b;color:#111827':''}">${x}</button>`).join('')}</div><div class="summarybox" style="margin-top:10px">${levelText(lev)}</div></div>`}function levelText(l){return {A:'Baja tolerancia a carga · Isométricos + fuerza lenta + recuperación de capacidad.',B:'Tolera fuerza, no energía elástica · Fuerza pesada/lenta + introducción progresiva de pliometría.',C:'Tolera fuerza y saltos básicos · Pliometría + carrera + aceleración + desaceleración.',D:'Fase avanzada · Sprint + COD + desaceleraciones + acciones específicas de fútbol.'}[l]||''}function home(){let d=S.session.data;return `<div class="card"><div class="h1">MIGUEL</div><div class="mut">Senior · Fútbol</div><div class="h2" style="color:var(--acc);margin-top:20px">Readaptación Tendón Rotuliano</div><div class="grid2">${[['Fecha valoración',S.session.date],['Estado actual',S.session.status],['Dolor actual NRS',n(d.painRest)+'/10'],['VISA-P',S.session.visaP?S.session.visaP+'/100':'—'],['Fase actual',S.session.phase],['Pierna lesionada',S.profile.injuredSide||'Pendiente']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><button class="btn" style="margin-top:16px" data-tab="Sesión">INICIAR SESIÓN 0</button></div><div class="card mut">Herramienta de apoyo para preparación física y readaptación. No diagnostica ni sustituye el criterio profesional.</div>`}function profile(){let p=S.profile;return `<div class="card"><div class="k">Jugador</div><div class="h2">Perfil de Miguel</div>${field('Nombre','name','text','profile')}${field('Categoría','category','text','profile')}${field('Deporte','sport','text','profile')}${field('Posición','position','text','profile')}${sel('Pierna lesionada','injuredSide',['Derecha','Izquierda'],'profile')}${sel('Pierna dominante','dominantSide',['Derecha','Izquierda'],'profile')}${field('Fecha de lesión','injuryDate','date','profile')}${field('Inicio readaptación','rehabStartDate','date','profile')}${field('Diagnóstico médico','diagnosis','text','profile')}${field('Tiempo estimado de baja','estimatedTime','text','profile')}${area('Observaciones médicas','medicalNotes','profile')}${area('Restricciones actuales','restrictions','profile')}${field('Profesional responsable','professional','text','profile')}</div>`}function maxPain(){return Math.max(0,...Object.entries(S.session.data).filter(([k])=>/pain|nrs/i.test(k)).map(([,v])=>n(v)))}function finalize(){let d=S.session.data;let m={painMax:maxPain(),strengthAsym:asym(d.quadRightForce||d.quadRightLoad,d.quadLeftForce||d.quadLeftLoad),bestCMJ:Math.max(n(d.cmj1),n(d.cmj2),n(d.cmj3))};if(!S.session.level)S.session.level=suggest();S.history.push({id:Date.now(),date:S.session.date,type:'Sesión 0 · Valoración inicial',painStart:n(d.painRest),painMax:m.painMax,painEnd:n(d.isoAfter||d.painRest),rpe:n(d.isoRPE),state24h:'Pendiente',metrics:m});S.tab='Resumen';save();render()}function summary(){let d=S.session.data,m=S.history.at(-1)?.metrics||{painMax:maxPain(),strengthAsym:0,bestCMJ:0};return `<div class="card"><div class="k">Valoración inicial</div><div class="h1">MIGUEL</div><div class="mut">${S.session.date}</div><div class="grid2" style="margin-top:15px">${[['Dolor reposo',n(d.painRest)+'/10'],['Dolor máximo',m.painMax+'/10'],['VISA-P',S.session.visaP?S.session.visaP+'/100':'—'],['Asimetría fuerza',m.strengthAsym.toFixed(1)+'%'],['Mejor CMJ',m.bestCMJ.toFixed(1)+' cm'],['Nivel actual',S.session.level||'—']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>${area('Principales limitaciones','limitations','session')}${area('Fortalezas actuales','strengths','session')}${area('Objetivos iniciales','objectives','session')}${area('Observaciones del preparador físico','pfNotes','session')}</div><div class="card"><div class="k">Control 24 h</div><div class="h2">Respuesta posterior a la carga</div>${['morningPain','morningStiffness','walkPain','stairsPain','activityPain'].map((k,i)=>nrs24(['Dolor al levantarse','Rigidez matutina','Dolor caminando','Dolor escaleras','Dolor durante actividad'][i],k)).join('')}${sel24('Sensación general','general',['Mucho mejor','Mejor','Igual','Peor','Mucho peor'])}${sel24('¿La sesión anterior fue bien tolerada?','tolerated',['Sí','No','Dudoso'])}<button class="btn" id="save24">GUARDAR CONTROL 24 H</button></div>`}function nrs24(l,k){let v=n(S.session.control24[k]);return `<div class="field"><label>${l}</label><div class="nrsrow"><input data-nrs24="${k}" type="range" min="0" max="10" value="${v}"><span id="v24_${k}" class="pill ${pc(v)}">${v}/10</span></div></div>`}function sel24(l,k,opts){let v=S.session.control24[k]||'';return `<div class="field"><label>${l}</label><select data-24="${k}"><option value="">Seleccionar</option>${opts.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function history(){return `<div class="card"><div class="k">Historial</div><div class="h2">Sesiones registradas</div>${S.history.length?S.history.slice().reverse().map(h=>`<div class="historyItem"><b>${h.date} · ${h.type}</b><div class="tiny">Inicio ${h.painStart} · Máx ${h.painMax} · Final ${h.painEnd} · RPE ${h.rpe} · 24h ${h.state24h}</div></div>`).join(''):'<div class="mut">Aún no hay sesiones finalizadas.</div>'}</div>`}function evolution(){let h=S.history;return `<div class="card"><div class="k">Dashboard</div><div class="h2">Evolución longitudinal</div><div class="mut">Arquitectura preparada para futuras sesiones.</div>${['Dolor basal','Dolor máximo','Asimetría fuerza','CMJ','RPE'].map((l,i)=>`<div style="margin-top:16px"><b>${l}</b>${painBars(h.map(x=>[x.date.slice(5),[x.painStart,x.painMax,x.metrics?.strengthAsym,x.metrics?.bestCMJ,x.rpe][i]]))}</div>`).join('')}</div>`}function renderNav(){let a=['Inicio','Sesión','Evolución','Historial','Perfil'];nav.innerHTML=a.map(x=>`<button data-tab="${x}" class="${S.tab===x?'on':''}">${x}</button>`).join('')}function render(){save();renderNav();main.innerHTML=S.tab==='Inicio'?home():S.tab==='Sesión'?sessionHTML():S.tab==='Perfil'?profile():S.tab==='Historial'?history():S.tab==='Evolución'?evolution():summary();bind()}function setVal(obj,k,v){if(obj==='profile')S.profile[k]=v;else if(obj==='session')S.session[k]=v;else S.session.data[k]=v;save()}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.open=+b.dataset.open;render()});document.querySelectorAll('[data-obj]').forEach(el=>el.onchange=()=>{setVal(el.dataset.obj,el.dataset.k,el.value);render()});document.querySelectorAll('[data-block]').forEach(el=>el.onchange=()=>{S.session.blocks[el.dataset.block]=el.value;render()});document.querySelectorAll('[data-nrs]').forEach(el=>el.oninput=()=>{S.session.data[el.dataset.nrs]=el.value;let v=document.getElementById('v_'+el.dataset.nrs);v.textContent=el.value+'/10';v.className='pill '+pc(el.value);save()});document.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{S.session.data[b.dataset.yn]=b.dataset.v;render()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{S.session.level=b.dataset.level;render()});document.querySelectorAll('[data-nrs24]').forEach(el=>el.oninput=()=>{S.session.control24[el.dataset.nrs24]=el.value;let v=document.getElementById('v24_'+el.dataset.nrs24);v.textContent=el.value+'/10';v.className='pill '+pc(el.value);save()});document.querySelectorAll('[data-24]').forEach(el=>el.onchange=()=>{S.session.control24[el.dataset['24']]=el.value;save()});let f=document.getElementById('finalize');if(f)f.onclick=finalize;let s24=document.getElementById('save24');if(s24)s24.onclick=()=>{let h=S.history.at(-1);if(h)h.state24h=S.session.control24.tolerated||'Pendiente';save();alert('Control 24 h guardado')};}const main=document.getElementById('main'),nav=document.getElementById('nav');render();
</script></body></html>
