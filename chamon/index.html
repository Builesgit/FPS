<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>FPS Player · Ángel Chamon</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#171f2a;--text:#f5f7fa;--muted:#9aa7b5;--accent:#ff9d00;--line:#26313e;--green:#26c281;--yellow:#f6c344;--red:#ff5c5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh}
.app{max-width:480px;margin:0 auto;min-height:100svh;background:linear-gradient(180deg,#0d1218,#0b0f14);overflow:hidden}
.top{height:auto;overflow:hidden;background:rgba(11,15,20,.98);border-bottom:1px solid var(--line);transition:max-height .25s ease,opacity .2s ease}
.brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 11px}
.logo{font-weight:900;letter-spacing:.08em;font-size:18px}.logo span{color:var(--accent)}
.player{font-size:12px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daybtn{border:1px solid var(--line);background:#111721;color:var(--muted);border-radius:999px;padding:9px 12px;min-width:58px;font-weight:800}
.daybtn.active{background:var(--accent);color:#111;border-color:var(--accent)}
.progressDock{display:none;padding:12px 16px 13px;background:rgba(11,15,20,.98);border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.app.compact .top{max-height:0;opacity:0;border-color:transparent}
.app.compact .progressDock{display:block}
.progressLabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.progress{height:8px;background:#18212b;border-radius:999px;overflow:hidden}
.progressBar{height:100%;width:0;background:var(--accent);transition:.2s}
.feed{height:calc(100svh - 126px);overflow-y:auto;scroll-snap-type:y proximity;padding:0 12px calc(100px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.app.compact .feed{height:calc(100svh - 58px)}
.summary{scroll-snap-align:start;min-height:calc(100svh - 138px);padding:26px 10px 24px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:13px;color:var(--accent);font-weight:900;letter-spacing:.12em}
.summary h1{font-size:34px;line-height:1.03;margin:10px 0 14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.badge{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--muted)}
.badge.low{color:var(--green)}.badge.med{color:var(--yellow)}.badge.high{color:var(--red)}
.sectionLabel{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.objective{font-size:17px;line-height:1.45;margin-bottom:22px}
.exerciseSummary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.pill{background:#111821;border:1px solid var(--line);border-radius:14px;padding:10px 11px;font-size:12px;line-height:1.25}
.summaryProgress{margin-top:auto;padding-top:16px}
.hint{margin-top:11px;font-size:12px;color:var(--muted)}
.card{scroll-snap-align:start;min-height:calc(100svh - 90px);display:flex;flex-direction:column;justify-content:flex-start;margin:0 0 16px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px 22px calc(26px + env(safe-area-inset-bottom));box-shadow:0 18px 50px rgba(0,0,0,.25)}
.counter{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em}
.card h2{font-size:31px;line-height:1.05;margin:18px 0 20px}
.big{font-size:25px;font-weight:900;color:var(--accent);margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.info{background:#0e141b;border:1px solid var(--line);border-radius:16px;padding:13px}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.value{font-size:15px;font-weight:800;line-height:1.25}
.desc{font-size:17px;line-height:1.5;color:#e8edf3;margin:8px 0 24px}
.complete{margin-top:auto;width:100%;min-height:52px;border:none;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:900;background:#202a36;color:#fff;touch-action:manipulation}
.complete.done{background:var(--green);color:#07140e}
@media(min-width:700px){body{background:#080b0f}.app{box-shadow:0 0 80px rgba(0,0,0,.45)}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div class="brand"><div class="logo">FPS <span>PLAYER</span></div><div class="player">Ángel Chamon · v0ACh</div></div><div class="days" id="days"></div></header>
<div class="progressDock"><div class="progressLabel"><span>Progreso de la sesión</span><span id="dockProgressText"></span></div><div class="progress"><div class="progressBar" id="dockProgressBar"></div></div></div>
<main class="feed" id="feed"></main>
</div>
<script>
const week=[{"key":"sun","day":"DOM","date":"23 AGO","title":"Recuperación + exposición suave","load":"Baja","loadClass":"low","duration":"25–30 min","objective":"Favorecer la recuperación y mantener estímulo de cuádriceps sin aumentar síntomas.","exercises":[["Movilidad activa cadera/rodilla","2×8/lado","2/10","Sin material","Realiza flexión y extensión de rodilla y movilidad de cadera de forma lenta, sin forzar el rango."],["Wall Sit ISO","3×30'' · 40'' descanso","4/10","Pared","Apoya la espalda en la pared y mantén una posición cómoda de sentadilla, repartiendo la carga."],["Split Squat ISO","3×25''/lado · 40'' descanso","4/10","Sin material","Mantén la posición de zancada sin movimiento, con pelvis y rodilla estables."],["⚠️ Reverse Nordic · ROM corto","3×5 · 45'' descanso","3–4/10","Superficie cómoda","De rodillas y con tronco y cadera alineados, inclínate ligeramente hacia atrás. Detente antes de notar la zona y vuelve."],["Puente glúteo unilateral","3×8/lado · 40'' descanso","4/10","Sin material","Eleva la pelvis empujando con un pie, pausa un segundo arriba y baja lentamente."],["Sóleo unilateral","3×12/lado · 40'' descanso","4/10","Escalón opcional","Con la rodilla ligeramente flexionada, eleva el talón y baja de forma controlada."],["Dead Bug","2×8/lado","3/10","Sin material","Extiende brazo y pierna contrarios manteniendo abdomen activo y zona lumbar estable."]]},{"key":"mon","day":"LUN","date":"24 AGO","title":"Fuerza sin material + longitud","load":"Baja–moderada","loadClass":"med","duration":"30–35 min","objective":"Acumular fuerza sin material y aumentar de forma controlada la tolerancia en longitudes mayores.","exercises":[["Movilidad dinámica","5 min","2/10","Sin material","Moviliza cadera y rodilla progresivamente, sin estiramientos intensos."],["Split Squat tempo 3-1-1","3×8/lado · 45'' descanso","5/10","Sin material","Baja en 3 segundos, pausa 1 segundo y sube de forma controlada."],["Wall Sit unilateral asistido","3×25''/lado · 45'' descanso","5/10","Pared","Mantén la posición cargando principalmente una pierna y usa la otra solo como ayuda."],["⚠️ Reverse Nordic · ROM parcial","3×5 · 45'' descanso","4/10","Superficie cómoda","Inclínate hacia atrás manteniendo cadera y tronco alineados. Aumenta el recorrido solo si no aparece molestia."],["Split Squat · pierna afectada retrasada","2×6/lado · 45'' descanso","4/10","Sin material","Coloca la pierna afectada detrás y desciende de forma progresiva. No busques máxima profundidad."],["Puente glúteo unilateral","3×10/lado","5/10","Sin material","Eleva la pelvis con una pierna y controla la bajada."],["Sóleo unilateral","3×12/lado","5/10","Escalón opcional","Eleva y baja el talón con control manteniendo ligera flexión de rodilla."],["Copenhagen corto","2×20''/lado","4/10","Sofá o banco estable","Apoya la rodilla superior y mantén la pelvis elevada y estable."]]},{"key":"tue","day":"MAR","date":"25 AGO","title":"Fuerza principal I","load":"Alta","loadClass":"high","duration":"45–50 min","objective":"Aplicar el primer estímulo alto de fuerza de la semana manteniendo control técnico y sin fatiga excesiva.","exercises":[["Bicicleta","5 min","2/10","Bicicleta estática","Pedalea a ritmo cómodo para preparar la pierna."],["Extensión de cuádriceps unilateral","4×5 · 90'' descanso","7–8/10","Goma","Extiende la rodilla. Baja lentamente y no llegues al fallo."],["Split Squat cargado","4×5/lado · 90'' descanso","7/10","Mancuernas o barra","Desciende con control y empuja con la pierna adelantada manteniendo buena alineación."],["Step-up cargado","3×6/lado · 60'' descanso","6/10","Cajón + carga","Sube empujando con la pierna de apoyo y controla especialmente el descenso."],["⚠️ Reverse Nordic · parcial","3×5 · 60'' descanso","4–5/10","Superficie cómoda","Inclínate hacia atrás solo dentro del rango tolerado. No fuerces el punto de molestia."],["Hip Thrust","3×6 · 75'' descanso","7/10","Banco + barra/carga","Eleva la pelvis con fuerza, pausa arriba y baja de forma controlada."],["Sóleo sentado","3×8 · 60'' descanso","6/10","Banco + carga","Con rodillas flexionadas, eleva los talones, pausa arriba y baja lentamente."]]},{"key":"wed","day":"MIÉ","date":"26 AGO","title":"Recuperación + carrera controlada","load":"Baja","loadClass":"low","duration":"30–40 min","objective":"Recuperar y reintroducir carrera lineal progresiva sin reproducir la molestia en máxima longitud.","exercises":[["Bicicleta","6 min","2/10","Bicicleta estática","Pedalea de forma cómoda y continua."],["Extensión cuádriceps ISO","2×25'' · 40'' descanso","4/10","Goma","Mantén tensión contra la resistencia sin mover la rodilla."],["Split Squat ISO","2×20''/lado","4/10","Sin material","Mantén una zancada estable sin movimiento."],["⚠️ Reverse Nordic · ROM corto","2×5","3/10","Superficie cómoda","Realiza un recorrido corto y cómodo, sin acercarte al punto de molestia."],["Sóleo","2×10/lado","4/10","Carga opcional","Eleva el talón y controla el descenso."],["Marcha rápida","2×20 m","2/10","Espacio de campo","Camina rápido aumentando progresivamente el ritmo antes de empezar a correr."],["Carrera progresiva","2×20 m 40–50% + 2×20 m 50% + 2×20 m 60% + 2×20 m 65%","3–4/10","Espacio de campo","Aumenta poco a poco la velocidad. Mantén una zancada natural y para si aparece la molestia."],["Carrera 70% · solo si asintomático","2×20 m","4/10","Espacio de campo","Realízala únicamente si todos los bloques anteriores se han hecho sin molestia."]]},{"key":"thu","day":"JUE","date":"27 AGO","title":"Fuerza principal II","load":"Alta","loadClass":"high","duration":"45–50 min","objective":"Consolidar fuerza unilateral y aumentar la capacidad del cuádriceps en rangos tolerados.","exercises":[["Bicicleta","5 min","2/10","Bicicleta estática","Pedalea cómodamente para preparar la sesión."],["Extensión cuádriceps unilateral","4×6 · 90'' descanso","7–8/10","Goma","Carga exigente pero controlable, sin fallo y controlando la bajada."],["Split Squat cargado","4×5/lado · 90'' descanso","7–8/10","Barra o mancuernas","Baja con control y vuelve empujando fuerte sin perder la posición."],["Spanish Squat Dinámico","3×8/lado · 75'' descanso","7/10","Goma","Banda anclada detrás de las rodillas. Desciende de forma controlada hasta ~90° de flexión y vuelve extendiendo las rodillas, manteniendo el tronco estable y tensión constante en la banda."],["Step-down cargado","3×6/lado · 60'' descanso","6/10","Cajón + carga","Desciende lentamente desde el cajón manteniendo rodilla y cadera estables."],["⚠️ Reverse Nordic","3×5 · 60'' descanso","5/10","Superficie cómoda","Aumenta el recorrido solo si los días anteriores han sido bien tolerados."],["Hip Thrust","3×6 · 75'' descanso","7/10","Banco + barra/carga","Eleva la pelvis con fuerza y controla la bajada."],["Sóleo sentado","3×8","6/10","Banco + carga","Eleva los talones con rodillas flexionadas y baja lentamente."],["Copenhagen corto","2×20''/lado","5/10","Banco","Mantén pelvis elevada con la rodilla superior apoyada."]]},{"key":"fri","day":"VIE","date":"28 AGO","title":"Fuerza complementaria + carrera","load":"Moderada","loadClass":"med","duration":"35–45 min","objective":"Mantener fuerza con menor volumen y consolidar la máxima velocidad de carrera asintomática.","exercises":[["Bicicleta","5 min","2/10","Bicicleta estática","Pedalea cómodamente."],["Extensión de rodilla ISO con goma","3×6 · 60'' descanso","6/10","Goma","Carga moderada, ejecución controlada y sin buscar fatiga alta."],["Split Squat","2×6/lado · 60'' descanso","6/10","Carga opcional","Desciende y sube manteniendo pelvis y rodilla estables."],["⚠️ Reverse Nordic","2×5","4–5/10","Superficie cómoda","Trabaja únicamente dentro del recorrido que puedas controlar sin molestia."],["RDL unilateral","2×6/lado","5/10","Mancuerna o kettlebell","Inclina el tronco desde la cadera y vuelve extendiéndola, manteniendo espalda estable."],["Sóleo","2×10/lado","5/10","Carga opcional","Eleva el talón y controla el descenso."],["Carrera progresiva","Repetir techo asintomático del miércoles; si fue bien: 2×20 m 50% + 2×60% + 2×70% + 2×75%","4/10","Espacio de campo","Consolida primero la velocidad tolerada. Sube un escalón solo si no aparece molestia."]]},{"key":"sat","day":"SÁB","date":"29 AGO","title":"Exposición funcional","load":"Moderada","loadClass":"med","duration":"35–45 min","objective":"Integrar carrera, desplazamientos y balón de forma progresiva sin aumentar la exposición máxima.","exercises":[["Bicicleta","5 min","2/10","Bicicleta estática","Pedalea de forma cómoda."],["Extensión cuádriceps ISO","2×20''","4/10","Máquina extensora","Mantén tensión moderada sin movimiento."],["Split Squat ISO","2×20''/lado","4/10","Sin material","Mantén la posición estable sin movimiento."],["⚠️ Reverse Nordic · parcial","2×4","4/10","Superficie cómoda","Realiza un recorrido controlado y sin buscar el límite."],["Carrera progresiva","Repetir máxima velocidad asintomática del viernes","4/10","Espacio de campo","Repite el nivel tolerado; no es obligatorio aumentar la velocidad."],["Curvas amplias","3–4×20 m al 60–70%","4/10","Espacio de campo","Corre describiendo una curva amplia, sin cambios bruscos ni frenadas fuertes."],["Desplazamiento lateral","2×10 m/lado","3–4/10","Espacio de campo","Desplázate lateralmente de forma controlada y sin cambios agresivos."],["Conducción","3×30''","3/10","Balón","Conduce de forma cómoda evitando cambios bruscos de dirección."],["Pase corto/medio","3×8","3–4/10","Balón","Realiza pases controlados sin buscar golpeos largos o máximos."]]}];
let current=localStorage.getItem('fps_day')||'sun';
const app=document.getElementById('app');const feed=document.getElementById('feed');
function storageKey(day,i){return `fps_${day}_${i}`}
function done(day,i){return localStorage.getItem(storageKey(day,i))==='1'}
function renderDays(){const el=document.getElementById('days');el.innerHTML=week.map(d=>`<button class="daybtn ${d.key===current?'active':''}" data-day="${d.key}">${d.day}<br><small>${d.date.split(' ')[0]}</small></button>`).join('');el.querySelectorAll('.daybtn').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.day;localStorage.setItem('fps_day',current);render()}))}
function updateProgress(d){const count=d.exercises.reduce((n,_,i)=>n+(done(d.key,i)?1:0),0);const pct=d.exercises.length?count/d.exercises.length*100:0;const sText=document.getElementById('summaryProgressText');const sBar=document.getElementById('summaryProgressBar');const dText=document.getElementById('dockProgressText');const dBar=document.getElementById('dockProgressBar');if(sText)sText.textContent=`${count}/${d.exercises.length}`;if(sBar)sBar.style.width=`${pct}%`;if(dText)dText.textContent=`${count}/${d.exercises.length}`;if(dBar)dBar.style.width=`${pct}%`}
function render(){renderDays();const d=week.find(x=>x.key===current);const summaryNames=d.exercises.map(e=>e[0].replace('⚠️ ',''));feed.innerHTML=`<section class="summary"><div class="kicker">${d.day} · ${d.date}</div><h1>${d.title}</h1><div class="meta"><span class="badge ${d.loadClass}">Carga ${d.load}</span><span class="badge">⏱ ${d.duration}</span></div><div class="sectionLabel">Objetivo de la sesión</div><div class="objective">${d.objective}</div><div class="sectionLabel">Resumen · ${d.exercises.length} ejercicios</div><div class="exerciseSummary">${summaryNames.map((n,i)=>`<div class="pill">${String(i+1).padStart(2,'0')} · ${n}</div>`).join('')}</div><div class="summaryProgress"><div class="progressLabel"><span>Progreso de la sesión</span><span id="summaryProgressText"></span></div><div class="progress"><div class="progressBar" id="summaryProgressBar"></div></div><div class="hint">Marca cada ejercicio al terminarlo.</div></div></section>${d.exercises.map((e,i)=>`<section class="card" data-card="${i}"><div class="counter">${String(i+1).padStart(2,'0')} / ${String(d.exercises.length).padStart(2,'0')}</div><h2>${e[0]}</h2><div class="big">${e[1]}</div><div class="grid"><div class="info"><div class="label">Intensidad</div><div class="value">${e[2]}</div></div><div class="info"><div class="label">Material</div><div class="value">${e[3]}</div></div></div><div class="label">Cómo se realiza</div><div class="desc">${e[4]}</div><button type="button" class="complete ${done(d.key,i)?'done':''}" data-i="${i}">${done(d.key,i)?'✓ Completado':'Marcar como completado'}</button></section>`).join('')}`;feed.scrollTop=0;app.classList.remove('compact');feed.querySelectorAll('.complete').forEach(btn=>btn.addEventListener('click',ev=>{ev.preventDefault();const i=Number(btn.dataset.i);const next=!done(d.key,i);localStorage.setItem(storageKey(d.key,i),next?'1':'0');btn.classList.toggle('done',next);btn.textContent=next?'✓ Completado':'Marcar como completado';updateProgress(d)}));updateProgress(d)}
let raf=false;feed.addEventListener('scroll',()=>{if(raf)return;raf=true;requestAnimationFrame(()=>{app.classList.toggle('compact',feed.scrollTop>80);raf=false})},{passive:true});
render();
</script>
</body>
</html>
