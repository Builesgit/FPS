<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>FPS Player · Ángel Chamon</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="../0ACh/chamon.html" title="FPS Player Ángel Chamon"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=w.document;
  function patch(){
    d.querySelectorAll('.complete').forEach(btn=>{
      if(btn.dataset.fixed==='1') return;
      btn.dataset.fixed='1';
      btn.onclick=(ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const active=d.querySelector('.daybtn.active');
        const day=active?active.dataset.day:(w.localStorage.getItem('fps_day')||'sun');
        const i=Number(btn.dataset.i);
        const k=`fps_${day}_${i}`;
        const done=w.localStorage.getItem(k)==='1';
        w.localStorage.setItem(k,done?'0':'1');
        btn.classList.toggle('done',!done);
        btn.textContent=!done?'✓ Completado':'Marcar como completado';
        const all=[...d.querySelectorAll('.complete')];
        const count=all.filter(b=>b.classList.contains('done')).length;
        const txt=d.getElementById('progressText');
        const bar=d.getElementById('progressBar');
        if(txt) txt.textContent=`${count}/${all.length}`;
        if(bar) bar.style.width=`${all.length?(count/all.length)*100:0}%`;
      };
    });
  }
  patch();
  new MutationObserver(patch).observe(d.body,{childList:true,subtree:true});
});
</script>
</body>
</html>
