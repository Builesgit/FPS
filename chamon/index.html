<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>FPS Player · Ángel Chamon</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="../0ACh/chamon.html" title="FPS Player Ángel Chamon"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=w.document;

  const uxStyle=d.createElement('style');
  uxStyle.textContent=`
    .top,.hero,.hint{transition:max-height .22s ease,opacity .18s ease,padding .22s ease,margin .22s ease,border-color .22s ease;max-height:240px}
    .progressWrap{position:relative;z-index:80;background:rgba(11,15,20,.97);transition:padding .22s ease,box-shadow .22s ease}
    .feed{transition:height .22s ease}
    .app.fps-compact .top,.app.fps-compact .hero,.app.fps-compact .hint{max-height:0!important;opacity:0;overflow:hidden;padding-top:0!important;padding-bottom:0!important;margin:0!important;border-color:transparent!important}
    .app.fps-compact .progressWrap{position:sticky;top:0;padding:12px 16px 13px;box-shadow:0 8px 24px rgba(0,0,0,.30)}
    .app.fps-compact .progressLabel{margin-bottom:7px}
    .app.fps-compact .feed{height:calc(100svh - 58px)!important}
  `;
  d.head.appendChild(uxStyle);

  function setCard(card,{name,freq,intensity,material,desc}){
    const h2=card.querySelector('h2'); if(h2) h2.textContent=name;
    const big=card.querySelector('.big'); if(big) big.textContent=freq;
    const values=card.querySelectorAll('.value');
    if(values[0]) values[0].textContent=intensity;
    if(values[1]) values[1].textContent=material;
    const description=card.querySelector('.desc'); if(description) description.textContent=desc;
  }

  function currentDay(){
    const active=d.querySelector('.daybtn.active');
    return active?active.dataset.day:(w.localStorage.getItem('fps_day')||'sun');
  }

  function patchExercises(){
    const day=currentDay();
    const cards=[...d.querySelectorAll('.card')];

    if(day==='tue'){
      const ext=cards.find(c=>c.querySelector('h2')?.textContent.includes('Extensión de cuádriceps unilateral'));
      if(ext){
        const values=ext.querySelectorAll('.value');
        if(values[1]) values[1].textContent='Goma';
        const desc=ext.querySelector('.desc');
        if(desc) desc.textContent='Extiende la rodilla. Baja lentamente y no llegues al fallo.';
      }
      const press=cards.find(c=>c.querySelector('h2')?.textContent.includes('Prensa unilateral'));
      if(press) press.remove();
    }

    if(day==='thu'){
      const ext=cards.find(c=>c.querySelector('h2')?.textContent.includes('Extensión cuádriceps unilateral'));
      if(ext){
        const values=ext.querySelectorAll('.value');
        if(values[1]) values[1].textContent='Goma';
      }
      const press=cards.find(c=>c.querySelector('h2')?.textContent.includes('Prensa unilateral'));
      if(press){
        setCard(press,{
          name:'Spanish Squat Dinámico',
          freq:"3×8/lado · 75'' descanso",
          intensity:'7/10',
          material:'Goma',
          desc:'Banda anclada detrás de las rodillas. Desciende de forma controlada hasta ~90° de flexión y vuelve extendiendo las rodillas, manteniendo el tronco estable y tensión constante en la banda.'
        });
      }
    }

    if(day==='fri'){
      const ext=cards.find(c=>c.querySelector('h2')?.textContent==='Extensión cuádriceps');
      if(ext){
        setCard(ext,{
          name:'Extensión de rodilla ISO con goma',
          freq:"3×6 · 60'' descanso",
          intensity:'6/10',
          material:'Goma',
          desc:'Carga moderada, ejecución controlada y sin buscar fatiga alta.'
        });
      }
    }
  }

  function refreshProgress(){
    const all=[...d.querySelectorAll('.complete')];
    const count=all.filter(b=>b.classList.contains('done')).length;
    const txt=d.getElementById('progressText');
    const bar=d.getElementById('progressBar');
    if(txt) txt.textContent=`${count}/${all.length}`;
    if(bar) bar.style.width=`${all.length?(count/all.length)*100:0}%`;
  }

  function applyViewPatches(){
    const hint=d.querySelector('.hint');
    if(hint) hint.textContent='Marca cada ejercicio al terminarlo.';
    patchExercises();
    refreshProgress();
  }

  const feed=d.getElementById('feed');
  const app=d.querySelector('.app');
  if(feed && app){
    feed.addEventListener('scroll',()=>{
      if(feed.scrollTop>24) app.classList.add('fps-compact');
      else if(feed.scrollTop<8) app.classList.remove('fps-compact');
    },{passive:true});
  }

  d.addEventListener('click',(ev)=>{
    const complete=ev.target.closest('.complete');
    if(complete){
      ev.preventDefault();
      ev.stopImmediatePropagation();
      const day=currentDay();
      const i=Number(complete.dataset.i);
      const k=`fps_${day}_${i}`;
      const done=w.localStorage.getItem(k)==='1';
      const next=!done;
      w.localStorage.setItem(k,next?'1':'0');
      complete.classList.toggle('done',next);
      complete.textContent=next?'✓ Completado':'Marcar como completado';
      refreshProgress();
      return;
    }

    const dayBtn=ev.target.closest('.daybtn');
    if(dayBtn){
      setTimeout(()=>{
        if(app) app.classList.remove('fps-compact');
        applyViewPatches();
      },0);
    }
  },true);

  applyViewPatches();
});
</script>
</body>
</html>
